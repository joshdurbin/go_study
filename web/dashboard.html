<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Go Study — Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #1e1e1e; --panel: #252526; --panel2: #2d2d30; --border: #3e3e42;
    --fg: #d4d4d4; --muted: #858585; --accent: #4ec9b0; --accent2: #569cd6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; }
  header { padding: 14px 24px; background: var(--panel2); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 18px; margin: 0; color: var(--accent); }
  header a { color: var(--accent2); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  .container { max-width: 1280px; margin: 0 auto; padding: 24px; }
  .overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px; margin-bottom: 28px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 14px 16px; }
  .stat-label { color: var(--muted); font-size: 11.5px; text-transform: uppercase;
    letter-spacing: 0.5px; }
  .stat-value { color: var(--accent); font-size: 26px; font-weight: 600; margin-top: 4px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 18px; }
  .card h2 { margin: 0 0 14px 0; color: var(--accent2); font-size: 14px;
    text-transform: uppercase; letter-spacing: 0.5px; }
  .chart-wrap { position: relative; height: 280px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    font-weight: 600; }
  td.num, th.num { text-align: right; font-family: "SF Mono", Menlo, monospace; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  tr:hover { background: var(--panel2); }
  .lesson-path { color: var(--muted); font-family: "SF Mono", Menlo, monospace; font-size: 11.5px; }
</style>
</head>
<body>
<header>
  <h1>Go Study — Analytics</h1>
  <a href="/">← Back to lessons</a>
</header>
<div class="container">
  <div class="overview" id="overview"></div>

  <div class="row">
    <div class="card">
      <h2>Time per section (minutes)</h2>
      <div class="chart-wrap"><canvas id="chartTime"></canvas></div>
    </div>
    <div class="card">
      <h2>Engagement per section</h2>
      <div class="chart-wrap"><canvas id="chartEngage"></canvas></div>
    </div>
  </div>

  <div class="card" style="margin-bottom: 28px;">
    <h2>Lessons (sorted by time spent)</h2>
    <div id="lessonsTable"></div>
  </div>

  <div class="card">
    <h2>Hints most frequently revealed</h2>
    <div id="hintsTable"></div>
  </div>
</div>

<script>
const SECTION_LABELS = {
  basics: 'Basics',
  patterns: 'Design Patterns',
  interview_study: 'Interview Practice',
};

function fmtSeconds(s) {
  s = Number(s) || 0;
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60), sec = s % 60;
  if (m < 60) return m + 'm ' + sec + 's';
  const h = Math.floor(m / 60);
  return h + 'h ' + (m % 60) + 'm';
}

async function load() {
  const res = await fetch('/api/stats');
  const data = await res.json();
  renderOverview(data.overall);
  renderTimeChart(data.sections);
  renderEngagementChart(data.sections);
  renderLessons(data.lessons);
  renderHints(data.hints);
}

function renderOverview(o) {
  const cards = [
    {label: 'Sessions', value: o.sessions},
    {label: 'Lesson opens', value: o.opens},
    {label: 'Time on page', value: fmtSeconds(o.total_seconds)},
    {label: 'Hints revealed', value: o.hint_reveals},
    {label: 'Solutions revealed', value: o.solution_reveals},
    {label: 'Code runs', value: o.code_runs + ' (' + o.successful_runs + ' ✓)'},
  ];
  document.getElementById('overview').innerHTML = cards.map(c =>
    `<div class="stat"><div class="stat-label">${c.label}</div><div class="stat-value">${c.value}</div></div>`
  ).join('');
}

function sectionLabel(s) { return SECTION_LABELS[s] || s; }

function renderTimeChart(sections) {
  const labels = sections.map(s => sectionLabel(s.section));
  const minutes = sections.map(s => Math.round((s.total_seconds || 0) / 60 * 10) / 10);
  new Chart(document.getElementById('chartTime'), {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{label: 'Minutes', data: minutes, backgroundColor: '#4ec9b0'}],
    },
    options: chartOpts(),
  });
}

function renderEngagementChart(sections) {
  const labels = sections.map(s => sectionLabel(s.section));
  new Chart(document.getElementById('chartEngage'), {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [
        {label: 'Opens',    data: sections.map(s => s.opens),            backgroundColor: '#569cd6'},
        {label: 'Hints',    data: sections.map(s => s.hint_reveals),     backgroundColor: '#c586c0'},
        {label: 'Reveals',  data: sections.map(s => s.solution_reveals), backgroundColor: '#dcdcaa'},
        {label: 'Runs',     data: sections.map(s => s.code_runs),        backgroundColor: '#4ec9b0'},
      ],
    },
    options: chartOpts(),
  });
}

function chartOpts() {
  return {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { labels: { color: '#d4d4d4', font: { size: 11 } } } },
    scales: {
      x: { ticks: { color: '#d4d4d4' }, grid: { color: '#3e3e42' } },
      y: { ticks: { color: '#d4d4d4' }, grid: { color: '#3e3e42' }, beginAtZero: true },
    },
  };
}

function renderLessons(rows) {
  if (!rows.length) {
    document.getElementById('lessonsTable').innerHTML = '<div class="empty">No data yet — open some lessons.</div>';
    return;
  }
  const html = `<table>
    <thead><tr>
      <th>Lesson</th><th>Section</th>
      <th class="num">Opens</th><th class="num">Time</th>
      <th class="num">Hints</th><th class="num">Reveals</th><th class="num">Runs</th>
    </tr></thead><tbody>
    ${rows.map(r => `<tr>
      <td><div>${prettyName(r.lesson_path)}</div><div class="lesson-path">${r.lesson_path}</div></td>
      <td>${sectionLabel(r.section)}</td>
      <td class="num">${r.opens}</td>
      <td class="num">${fmtSeconds(r.total_seconds)}</td>
      <td class="num">${r.hint_reveals}</td>
      <td class="num">${r.solution_reveals}</td>
      <td class="num">${r.code_runs}</td>
    </tr>`).join('')}
    </tbody></table>`;
  document.getElementById('lessonsTable').innerHTML = html;
}

function renderHints(rows) {
  if (!rows.length) {
    document.getElementById('hintsTable').innerHTML = '<div class="empty">No hints revealed yet.</div>';
    return;
  }
  const top = rows.slice(0, 20);
  const html = `<table>
    <thead><tr><th>Lesson</th><th>Section</th><th class="num">Reveals</th></tr></thead>
    <tbody>${top.map(r => `<tr>
      <td><div>${prettyName(r.lesson_path)}</div><div class="lesson-path">${r.lesson_path}</div></td>
      <td>${sectionLabel(r.section)}</td>
      <td class="num">${r.reveals}</td>
    </tr>`).join('')}</tbody></table>`;
  document.getElementById('hintsTable').innerHTML = html;
}

function prettyName(path) {
  const base = path.split('/').pop().replace(/\.go$/, '').replace(/^\d+_/, '');
  return base.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
